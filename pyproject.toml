[project]
name = "perception-agent"
version = "0.1.0"
description = "An agentic visual investigation system using perception and geometry specialists."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "google-adk>=2.5.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai-agents>=0.17.5",
    "python-dotenv>=1.2.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.113",
]
[project.scripts]
perception-agent = "perception_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "perception_agent"
module-root = "src"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" },
]
torchvision = [
    { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true